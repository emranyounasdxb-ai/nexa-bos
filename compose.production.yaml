name: amafh-core

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AMAFH_POSTGRES_USER:?AMAFH_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AMAFH_POSTGRES_PASSWORD:?AMAFH_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${AMAFH_POSTGRES_DB:?AMAFH_POSTGRES_DB is required}
    volumes:
      - amafh_core_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DATABASE_URL: "postgresql+asyncpg://${AMAFH_POSTGRES_USER:?AMAFH_POSTGRES_USER is required}:${AMAFH_POSTGRES_PASSWORD:?AMAFH_POSTGRES_PASSWORD is required}@postgres:5432/${AMAFH_POSTGRES_DB:?AMAFH_POSTGRES_DB is required}"
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      API_URL: http://api:8000
    ports:
      - name: web
        target: 3000
        published: "${WEB_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      api:
        condition: service_healthy

volumes:
  amafh_core_pgdata:
    name: amafh-core-pgdata
