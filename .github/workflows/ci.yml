name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa
          POSTGRES_DB: nexa_bos_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_bos_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://nexa:nexa@localhost:5432/nexa_bos_test_ci
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BOOTSTRAP_SECRET: nexa-test-bootstrap-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Ruff lint
        working-directory: apps/api
        run: uv run ruff check .

      - name: Ruff format
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: ESLint
        run: pnpm lint:web

      - name: TypeScript
        run: pnpm typecheck:web

      - name: API tests
        working-directory: apps/api
        run: |
          export VERIFIED_TEST_SERVER=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' '${{ job.services.postgres.id }}')
          verify_test_database() {
            uv run python - <<'PY'
          import asyncio, os, runpy
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          guard = runpy.run_path('../../tests/api/database_safety.py')['validate_test_database_url']
          target = guard(os.environ.get('DATABASE_URL'))
          assert (target.host, target.port, target.database) == ('localhost', 5432, 'nexa_bos_test_ci')
          assert os.environ['VERIFIED_TEST_SERVER']
          async def verify():
              engine = create_async_engine(os.environ['DATABASE_URL'])
              try:
                  async with engine.connect() as connection:
                      row = (await connection.execute(text('SELECT current_database(), inet_server_addr()::text, inet_server_port()'))).one()
                      assert row == (target.database, os.environ['VERIFIED_TEST_SERVER'], 5432)
              finally:
                  await engine.dispose()
          asyncio.run(verify())
          print(f'Guard PASSED; connected identity verified: host={target.host} port={target.port} database={target.database}')
          PY
          }
          verify_test_database
          uv run alembic upgrade head
          verify_test_database
          uv run pytest

      - name: Next.js production build
        run: pnpm build:web
